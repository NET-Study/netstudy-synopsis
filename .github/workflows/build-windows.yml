name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis

      - name: Read the app version
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Stage the installer under a clean name
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "dist-release/NET-Study-Synopsis-${{ steps.ver.outputs.version }}-x64-setup.exe"

      - name: Attach installer to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NET Study Synopsis ${{ steps.ver.outputs.version }}
          fail_on_unmatched_files: true
          files: dist-release/NET-Study-Synopsis-*-x64-setup.exe
