[package]
name = "netstudy-synopsis"
version = "1.0.0"
description = "The four Gospels in parallel columns, from the makers of NET Study"
authors = ["NET Study"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "netstudy_synopsis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
